name: CI

# Every check runs through the Makefile so CI and `make check` are the same
# commands with the same pinned tool versions.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: .bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}
      - run: make fmt-check lint lint-windows

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: .bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}
      - run: make vuln osv-check

  commits:
    # commit rules from CLAUDE.md, same script as .githooks/commit-msg
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # PR fields go through env, never inline in the script, so a crafted
      # title cannot inject shell.
      - name: PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title"
          scripts/check-commit-msg.sh "$RUNNER_TEMP/title"
      # Same target the release procedure runs against the previous tag.
      - name: Commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: make check-commits BASE="$BASE" HEAD_REF="$HEAD"

  snapshot:
    # Proves the release config builds on every PR, publishes nothing. Uses the
    # same goreleaser action as release.yml so it exercises the release path,
    # not the local `go run` shortcut.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean --skip=publish
